name: Release

# Publishes the package to npm when a v<version> tag is pushed. npm's trusted publishing lets this workflow publish
# with no token (the package's npm settings name this file), and npm attaches the build's provenance.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The runner's Chrome; its sandbox needs user namespaces the runner may not allow.
      CHROME: /usr/bin/google-chrome
      CHROME_FLAGS: --no-sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: The tag is the package's version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm test
      - name: Publish, unless this version is already on npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm"
          else
            npm publish
          fi
